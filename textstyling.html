<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
       body{
         background-color: darkblue;
         color: white;
         font-family: Arial, sans-serif;
       } 

       .hero-name   {
                       font-size: 60px;
                       font-weight: bold;
                       color: yellow;
                       text-shadow: 5px 5px 5px orange;

       }

       .tagline    {
                           font-style: italic lightblue;
                           color: blue;
                           text-transform: capitalize;
                   }

      .lable {
                text-transform: uppercase;
                text-decoration: underline;
                color: coral;
             }

      .power {
                font-weight: bold;
                color: lightgreen;
             }       

      .weakness {
                     text-decoration: line-through;
                     color: gray;
                }       #

      .badge{
        font: size 28px; 
        font-weight: bold;
        color: gold;
        transform: rotate(15deg);
      }

      .made by{
                color: coral;
                font-style: italic;
            }

    </style>
</head>
<body>
    <h1 class="hero-name"> Thunder Kid</h1>
    <p class="tagline"> I am the strongest kid in the school</p>

    <h2 class="label"> Super powers</h2>
    <p class="Power"> I can run fast</p>
    <p class="Power"> I can jump high</p>

    <h2 class="label"> weakness</h2>
    <p class="weakness"> english homework</p>
    <p class="weakness"> math homework</p>
    <p class="badge"> Top Hero</p>
    <p class="made by"> Created by Reyansh</p>
</body>
</html>
