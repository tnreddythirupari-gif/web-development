<!DOCTYPE html>
<html lang="en">
<head>   
    <title>Document</title>
    <style>

        body {
            font-family: Arial, sans-serif;
            background: aliceblue;
            text-align: center;
            padding: 30px;
        }

        h1{
            color: #ff5a43;
        }

        zoo {
            border: 2px solid #ff5a43;
            width: 300px;
            margin: 16px auto;
            padding: 12px;
            border-radius: 10px;
            background: white;
        }

        .zone {
            border: 1px solid #ff5a43;
            margin: 6px 0;
            padding: 8px 12px;
            border-radius: 6px;
            text-align: left;
        }

        button {
            background-color: #ff5a43;
            color: white;
            padding: 10px 24px;
            border: none;
            border-radius: 20px;
            cursor: pointer;
        } 
  
           
    </style>
</head>
<body>

    <h1>My zoo</h1>
    <p>Use JavaScript and the DOM to add animals to each cage!</p>

    <div id="zoo">
        <div class="zone">zone1<span id="Zone1"></span></div>
        <div class="zone">zone2<span id="Zone2"></span></div>
        <div class="zone">zone3<span id="Zone3"></span></div>
        <div class="zone">total<span id="total"></span></div>
    </div>
    
    <br>

    <button onclick="openZoo()">Open the Zoo!</button>

    <p id="zoo-status"></p>

    <script>
             function openZoo(){
      document.getElementById("zone1").innerHTML = "lion";
      document.getElementById("zone2").innerHTML = "elephant";
      document.getElementById("zone3").innerHTML = "pengiun";
      document.getElementById("Total").innerHTML = "3";

      document.getElementById("zoo").style.backgroundColor = "lightgreen"

      document.getElementById("zoo-status").innerHTML = document.title + "is now open!";

        } 

        </script>
</body>
</html>
